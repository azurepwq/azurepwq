  <!-- Critical CSS -->
  <style>
    :root{--primary-color:#C25938;--github-color:#000000;--twitter-color:#000000;--email-color:#D14836;--accent-color:#C25938;--bg-color:#ffffff;--text-color:#222;--heading-color:#1a1a1a;--subheading-color:#2d2d2d;--border-color:rgba(0,0,0,0.05);--list-text-color:#333333}html[data-theme="dark"]{--bg-color:#121520;--text-color:#e1e5ed;--heading-color:#ffffff;--subheading-color:#e1e5ed;--border-color:rgba(255,255,255,0.1);--accent-color:#E27A59;--list-text-color:#ccd1da}html{scroll-behavior:smooth}body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg-color);color:var(--text-color);margin:0;padding:0 1rem;line-height:1.5}main{max-width:760px;margin:3rem auto;padding:0 2rem}h1{color:var(--accent-color);margin-top:1.5rem;margin-bottom:1rem;font-weight:700;letter-spacing:-0.01em;font-size:clamp(1.5rem,3.5vw,2rem)}h2{color:var(--subheading-color);margin-top:2.5rem;margin-bottom:1.2rem;font-weight:600;letter-spacing:-0.01em;padding-bottom:0.5rem;border-bottom:1px solid var(--border-color);font-size:clamp(1.3rem,3vw,1.5rem)}p:first-of-type{font-size:1.15rem;line-height:1.7;color:var(--subheading-color);margin:1.8rem 0 2.2rem;letter-spacing:0.01rem;font-weight:400}

  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "azurepwq",
    "url": "https://azurepwq.github.io",
    "jobTitle": "Software Engineer",
    "description": "JavaScript/TypeScript software engineer with interests in deep learning, AI security, and blockchain technology",
    "sameAs": [
      "https://github.com/azurepwq",
      "https://x.com/azurepwq"
    ],
    "knowsAbout": ["JavaScript", "TypeScript", "Deep Learning", "AI Security", "Blockchain"]

</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to content</a>
  <div class="theme-toggle">
    <button id="theme-toggle-btn" aria-label="Toggle dark/light mode">
      <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>
  <main id="main-content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="copyright">
      &copy; <span id="copyright-year"></span> azurepwq. All rights reserved.
    </div>
  </footer>
  <script src="{% include asset_path.html path='/assets/js/version.js' %}"></script>
  <!-- Commented out service worker scripts to fix 404 issues -->
  <!-- <script src="{% include asset_path.html path='/assets/js/service-worker-register.js' %}"></script> -->
  <!-- <script src="{% include asset_path.html path='/assets/js/offline.js' %}"></script> -->
  
  <!-- Unregister any existing service workers to prevent 404 issues -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister().then(function() {
            console.log('Service Worker unregistered successfully');
          });
        }
      });
    }
  </script>
  
  <script>
    // Theme toggle functionality
    (function() {
      const themeToggle = document.getElementById('theme-toggle-btn');
      const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
      
      // Check for saved theme preference or use the system preference
      const currentTheme = localStorage.getItem('theme') || 
                          (prefersDarkScheme.matches ? 'dark' : 'light');
      
      // Set the initial theme
      document.documentElement.setAttribute('data-theme', currentTheme);
      updateThemeToggleIcon(currentTheme);
      
      // Toggle theme when button is clicked
      themeToggle.addEventListener('click', () => {
        const newTheme = document.documentElement.getAttribute('data-theme') === 'light' 
                        ? 'dark' : 'light';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeToggleIcon(newTheme);
      });
      
      // Update the toggle icon based on current theme
      function updateThemeToggleIcon(theme) {
        const moonIcon = document.querySelector('.moon-icon');
        const sunIcon = document.querySelector('.sun-icon');
        
        if (theme === 'dark') {
          moonIcon.style.display = 'none';
          sunIcon.style.display = 'block';
        } else {
          moonIcon.style.display = 'block';
          sunIcon.style.display = 'none';
        }
      }
      
      // Update copyright year
      document.getElementById('copyright-year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
