# Site configuration
title: azurepwq
description: Developer | Problem Solver | Web Enthusiast
url: https://azurepwq.com
baseurl: ""
author: azurepwq
timezone: Asia/Shanghai
repository: "azurepwq/azurepwq"

# URL configuration
permalink: /:title/

# Build settings
markdown: kramdown
sass:
  style: compressed

# GitHub Pages settings
github: [metadata]
lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false

# Default layouts
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Asset versioning
asset_version: "1.0.1"

# Cache control
cache:
  enabled: false  # Disabled caching to avoid service worker issues
  max_age: 3600   # 1 hour for most resources
  s_maxage: 86400 # 1 day for CDN

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-github-metadata