# Site configuration
theme: null
markdown: kramdown
sass:
  style: compressed
title: "azurepwq"
description: "Azure Pan (azurepwq) - JavaScript/TypeScript software engineer with interests in deep learning, AI security, and blockchain technology"
repository: "azurepwq/azurepwq"
