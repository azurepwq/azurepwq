# Site configuration
title: Azure PWQ
description: Developer | Problem Solver | Web Enthusiast
url: https://azurepwq.com
baseurl: ""
author: Azure PWQ
timezone: Asia/Shanghai
repository: "azurepwq/azurepwq"

# Build settings
# Removed theme reference to use custom styles
markdown: kramdown
sass:
  style: compressed

# GitHub Pages settings
github: [metadata]
lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false

# Asset versioning (increment this when making significant changes)
asset_version: "1.0.1"

# Cache control
cache:
  enabled: true
  max_age: 3600        # 1 hour for most resources
  s_maxage: 86400      # 1 day for CDN

# Disable template caching for development
liquid:
  error_mode: strict
  strict_filters: true
  strict_variables: false

# Optional Google Analytics
google_analytics: # Optional

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-github-metadata