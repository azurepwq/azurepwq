name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/sync-readme-to-index.yml'
      - 'sync-readme-to-index.sh'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4
      
      # Set up Ruby environment
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true # Install and cache gems
      
      # Configure GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      
      # Install dependencies and build the site
      - name: Install dependencies
        run: bundle install
      
      - name: Build with Jekyll
        run: |
          # Build the site ignoring Sass warnings
          JEKYLL_ENV=production SASS_DEPRECATION_WARNINGS=false bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      
      # Ensure CNAME file exists for custom domain
      - name: Ensure CNAME File Exists
        run: |
          if [ ! -f "_site/CNAME" ]; then
            echo "azurepwq.com" > _site/CNAME
          fi
      
      # Upload the built site for deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 