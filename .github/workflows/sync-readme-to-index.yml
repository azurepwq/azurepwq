name: Sync README.md to home page

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/sync-readme-to-index.yml'
      - 'scripts/sync-readme-to-index.sh'
  workflow_dispatch:
  schedule:
    # Run every 6 hours to ensure sync happens even if other triggers fail
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run sync script
        run: |
          chmod +x scripts/sync-readme-to-index.sh
          ./scripts/sync-readme-to-index.sh
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # First, stage all changes to prevent "unstaged changes" error
          git add _pages/home.md
          
          # Check if there are changes to commit
          if ! git diff --cached --quiet; then
            # Pull latest changes to avoid conflicts
            git pull origin main --no-rebase
            
            # Commit and push changes
            git commit -m 'Sync README.md to home page [auto]'
            git push
          else
            echo "No changes detected in home.md"
          fi
