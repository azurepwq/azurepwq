name: Sync README.md to index.md

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/sync-readme-to-index.yml'
      - 'sync-readme-to-index.sh'
  workflow_dispatch:
  repository_dispatch:
    types: [readme_changed]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run sync script
        run: |
          chmod +x sync-readme-to-index.sh
          ./sync-readme-to-index.sh
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.md
          git diff --cached --quiet || git commit -m 'Sync README.md to index.md [auto]'
          git push 