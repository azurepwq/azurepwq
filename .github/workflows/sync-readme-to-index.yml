name: Sync README.md to home page

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/sync-readme-to-index.yml'
      - 'scripts/sync-readme-to-index.sh'
  workflow_dispatch:
  repository_dispatch:
    types: [readme_changed]
  schedule:
    # Run every 6 hours to ensure sync happens even if other triggers fail
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run sync script
        run: |
          chmod +x scripts/sync-readme-to-index.sh
          ./scripts/sync-readme-to-index.sh
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main 
          git add _pages/home.md
          git diff --cached --quiet || git commit -m 'Sync README.md to home page [auto]'
          git push 
