name: Trigger sync on README edit

on:
  push:
    branches: [main]
    paths:
      - 'README.md'

permissions:
  contents: write

jobs:
  trigger_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger README sync workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: readme_changed 